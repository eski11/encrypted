name: ENCPTD
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_REFLECTION_METADATA_LEVEL: without-names
      ENABLE_TESTABILITY: NO
      DEBUG_INFORMATION_FORMAT: dwarf
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_STYLE: all
packages:
  SignalBridge:
    path: Packages/SignalBridge
targets:
  ENCPTD:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eski11.encrypted
      CURRENT_PROJECT_VERSION: 8
      MARKETING_VERSION: '0.4.2'
      TARGETED_DEVICE_FAMILY: '1,2'
      GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SignalBridge
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: ENCPTD
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Unlock your encrypted chats.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  ENCPTDTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ENCPTD
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eski11.encrypted.tests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  ENCPTD:
    build:
      targets:
        ENCPTD: all
    test:
      targets: [ENCPTDTests]
