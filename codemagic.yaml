workflows:
  encptd-iphone:
    name: ENCPTD — custom iPhone app
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: '27.2'
      vars:
        HOMEBREW_NO_AUTO_UPDATE: '1'
    scripts:
      - name: Prepare ENCPTD project
        script: |
          set -euo pipefail
          brew install xcodegen
          mkdir -p artifacts
          node scripts/validate-configuration.mjs
          cd iphone
          xcodegen generate
      - name: Test encryption and local storage
        script: |
          set -euo pipefail
          xcrun simctl list devices available --json > artifacts/simulators.json
          SIMULATOR_ID=$(python3 -c 'import json; x=json.load(open("artifacts/simulators.json")); print(next(d["udid"] for ds in x["devices"].values() for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          xcodebuild test -project iphone/ENCPTD.xcodeproj -scheme ENCPTD \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$CM_BUILD_DIR/build-simulator" \
            -resultBundlePath "$CM_BUILD_DIR/artifacts/EncryptionTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee artifacts/tests.log
      - name: Build ENCPTD for iPhone
        script: |
          set -euo pipefail
          python3 scripts/prepare_release.py
          (cd iphone && xcodegen generate --spec project-release.yml)
          xcodebuild build -project iphone/ENCPTD.xcodeproj -scheme ENCPTD \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            2>&1 | tee artifacts/build.log
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          mkdir -p artifacts/package/Payload
          ditto build/Build/Products/Release-iphoneos/ENCPTD.app artifacts/package/Payload/ENCPTD.app
          cd artifacts/package
          /usr/bin/zip -qry ../ENCPTD-unsigned.ipa Payload
          cd ..
          shasum -a 256 ENCPTD-unsigned.ipa > ENCPTD-unsigned.ipa.sha256
    artifacts:
      - artifacts/ENCPTD-unsigned.ipa
      - artifacts/ENCPTD-unsigned.ipa.sha256
      - artifacts/tests.log
      - artifacts/build.log
      - artifacts/EncryptionTests.xcresult
